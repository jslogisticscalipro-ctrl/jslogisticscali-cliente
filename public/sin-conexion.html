<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f1f3d" />
<title>Sin conexión · JS Logistics</title>
<style>
  :root{color-scheme:light dark;--fondo:#f4f7fb;--tinta:#0f172a;--suave:#475569;--marca:#1f86c9}
  @media (prefers-color-scheme:dark){:root{--fondo:#0f1f3d;--tinta:#e8eef5;--suave:#9aa8b8}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--fondo);color:var(--tinta);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:360px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.25rem;margin:18px 0 8px}
  p{margin:0 0 22px;color:var(--suave);line-height:1.5;font-size:.95rem}
  button{min-height:46px;padding:0 26px;border:0;border-radius:12px;background:var(--marca);color:#fff;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/pwa/icono-app-192.png" alt="JS Logistics" />
  <h1>No hay conexión</h1>
  <p>No pudimos conectarnos a internet. Por seguridad no mostramos tus pedidos ni saldos guardados: revisa tu señal o el wifi y vuelve a intentar.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
